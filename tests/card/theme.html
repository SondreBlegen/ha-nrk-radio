<!doctype html>
<!--
  The card inside a Frosted-Glass-Dark-styled room section at phone width, next
  to Mushroom-like tiles, to check it blends in. Uses fixtures.js + harness.js.
  ?state=idle|playing
-->
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NRK card in theme</title>
<style>
  :root {
    --primary-color: rgb(106, 116, 211); --token-rgb-primary: 106, 116, 211;
    --primary-text-color: rgba(234, 235, 238, 0.98); --secondary-text-color: rgba(234, 235, 238, 0.8);
    --rgb-primary-text-color: 234, 235, 238; --divider-color: rgba(84, 84, 98, 0.28);
    --ha-card-border-radius: 18px; --ha-card-border-width: 0.5px; --ha-card-border-color: rgba(234, 235, 238, 0.1);
    --ha-card-box-shadow: 0 12px 20px rgba(0, 0, 0, 0.28); --ha-card-background: rgba(30, 30, 30, 0.1);
    --ha-card-glass-tint: rgba(28, 29, 33, 0.18); --ha-card-backdrop-filter: blur(10px) saturate(1.2);
    --ha-card-glass-inset-shadow: 3px 3px 0.5px -3.5px rgba(255,255,255,0.15) inset, -2px -2px 0.5px -2px rgba(255,255,255,0.1) inset, 0 0 8px 1px rgba(255,255,255,0.06) inset, 0 0 2px 0 rgba(0,0,0,0.18);
    --switch-checked-button-color: rgb(106, 116, 211); --switch-checked-track-color: rgb(106, 116, 211);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { margin: 0; min-height: 100vh; color: var(--primary-text-color);
         background: center / cover no-repeat fixed url('https://cdn.jsdelivr.net/gh/wessamlauf/homeassistant-frosted-glass-themes@refs/heads/main/themes/frosted-glass-dark-background.jpg') #15161c; }
  .phone { width: 390px; margin: 0 auto; padding: 16px 8px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; }
  h1 { font-size: 33px; font-weight: 700; margin: 16px 8px 8px; display: flex; gap: 10px; align-items: center; }
  /* Mushroom-ish reference tiles */
  .mush { display: flex; align-items: center; gap: 12px; padding: 12px; }
  .mush .ic { width: 40px; height: 40px; border-radius: 50%; background: rgba(234,235,238,0.06); display: flex; align-items: center; justify-content: center; color: rgba(234,235,238,0.75); }
  .mush .p { font-size: 14px; font-weight: 500; line-height: 20px; }
  .mush .s { font-size: 12px; line-height: 16px; color: var(--secondary-text-color); letter-spacing: 0.4px; }
</style>
<script>
  // The theme's card-mod "card-mod-card" glass layer, applied to every ha-card.
  const GLASS = `
    :host { display: block; position: relative; isolation: isolate; border-radius: var(--ha-card-border-radius);
            border: var(--ha-card-border-width) solid var(--ha-card-border-color); box-shadow: var(--ha-card-box-shadow);
            background: transparent; }
    :host::before { content: ''; position: absolute; inset: 0; border-radius: inherit; z-index: -1; pointer-events: none;
            background: var(--ha-card-glass-tint); backdrop-filter: var(--ha-card-backdrop-filter);
            -webkit-backdrop-filter: var(--ha-card-backdrop-filter); box-shadow: var(--ha-card-glass-inset-shadow); }`;
  customElements.define("ha-card", class extends HTMLElement {
    constructor() { super(); this.attachShadow({ mode: "open" }).innerHTML = `<style>${GLASS}</style><slot></slot>`; }
  });
  customElements.define("ha-switch", class extends HTMLElement {
    connectedCallback() {
      if (this._b) return;
      this.style.cssText = "display:inline-block;width:36px;height:20px;border-radius:10px;position:relative;cursor:pointer;flex:none";
      this._b = document.createElement("span");
      this._b.style.cssText = "position:absolute;top:2px;width:16px;height:16px;border-radius:50%;transition:left .15s";
      this.appendChild(this._b);
      this.addEventListener("click", () => { this.checked = !this.checked; this.dispatchEvent(new Event("change")); });
      this._paint();
    }
    set checked(v) { this._c = Boolean(v); this._paint(); }
    get checked() { return Boolean(this._c); }
    _paint() {
      if (!this._b) return;
      this.style.background = this._c ? "rgba(106,116,211,0.55)" : "rgba(234,235,238,0.18)";
      this._b.style.background = this._c ? "rgb(106,116,211)" : "rgba(234,235,238,0.6)";
      this._b.style.left = this._c ? "18px" : "2px";
    }
  });
</script>
<script src="fixtures.js"></script>
<script src="../../custom_components/nrk_radio/nrk-radio-card.js"></script>
</head>
<body>
<div class="phone">
  <h1>🧸 Kids' room</h1>
  <ha-card><div class="mush"><div class="ic">💡</div><div><div class="p">Room dimmer</div><div class="s">Off</div></div></div></ha-card>
  <ha-card><div class="mush"><div class="ic">🔈</div><div><div class="p">Speaker</div><div class="s">Off</div></div></div></ha-card>
  <ha-card><div class="mush"><div class="ic">🚪</div><div><div class="p">Door closed</div><div class="s">Mon 12 Oct, 20:33 · 14 minutes ago</div></div></div></ha-card>
  <div id="slot"></div>
</div>
<script>
  // A fake Music Assistant behind the card's bridge (nrk_radio/ma/*), fed with real NRK data.
  const P = "media-source://nrk_radio";
  const SHOW_URI = "nrk_radio://podcast/podcast:fantorangens_vitseshow";
  const src = FIXTURES.browse[`${P}/podcast/fantorangens_vitseshow`];
  const rows = src.children.map((c) => {
    const m = /^(\d\d\.\d\d\.\d\d) · (.*)$/.exec(c.title);
    const id = c.media_content_id.split("/").pop();
    return { uri: `nrk_radio://podcast_episode/podcast:fantorangens_vitseshow:${id}`, name: m ? m[2] : c.title,
             subtitle: m ? m[1] : null, image: c.thumbnail, media_type: "podcast_episode", can_play: true, can_expand: false };
  });
  const sim = { state: "idle", items: [], pos: 0, autoplay: false, n: 0 };
  if (new URLSearchParams(location.search).get("state") === "playing") {
    sim.state = "playing"; sim.autoplay = true;
    sim.items = [rows[0], rows[2], rows[3]].map((r) => ({ queue_item_id: `q${sim.n++}`, uri: r.uri, name: r.name }));
  }
  const PLAYER = "media_player.kids_speaker";
  let stamp = 0;
  function hass() {
    stamp++;
    return {
      language: "nb", locale: { language: "nb" },
      entities: { [PLAYER]: { entity_id: PLAYER, platform: "music_assistant" } },
      states: {
        [PLAYER]: { state: sim.state, last_updated: String(stamp), attributes: { friendly_name: "Kids speaker",
          media_title: sim.items[sim.pos]?.name } },
      },
      callWS: async (m) => {
        if (m.type === "nrk_radio/ma/item") return { item: { name: src.title, image: src.thumbnail, uri: SHOW_URI }, children: rows };
        if (m.type === "nrk_radio/ma/queue")
          return { queue_id: "q", state: sim.state, current_index: sim.items.length ? sim.pos : null, autoplay: sim.autoplay, items: sim.items };
        if (m.type === "nrk_radio/ma/play") {
          const r = rows.find((x) => x.uri === m.uri);
          const item = { queue_item_id: `q${sim.n++}`, uri: m.uri, name: r.name };
          if (m.enqueue === "add") sim.items.push(item); else { sim.items = [item]; sim.pos = 0; sim.state = "playing"; }
        } else if (m.type === "nrk_radio/ma/remove") sim.items = sim.items.filter((i) => i.queue_item_id !== m.queue_item_id);
        else if (m.type === "nrk_radio/ma/clear_upcoming") sim.items = sim.items.slice(0, sim.pos + 1);
        else if (m.type === "nrk_radio/ma/autoplay") sim.autoplay = m.enabled;
        setTimeout(() => { card.hass = hass(); }, 0);
        return null;
      },
      callService: async (d, s) => {
        if (s === "media_play_pause") sim.state = sim.state === "playing" ? "paused" : "playing";
        else if (s === "media_pause") sim.state = "paused";
        else if (s === "media_play") sim.state = "playing";
        else if (s === "media_stop") sim.state = "idle";
        card.hass = hass();
      },
    };
  }
  const card = document.createElement("nrk-radio-card");
  card.setConfig({ show: "podcast/fantorangens_vitseshow", player: PLAYER });
  document.getElementById("slot").appendChild(card);
  card.hass = hass();
</script>
</body>
</html>
